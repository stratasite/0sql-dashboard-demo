# Ported from the full cs-warehouse model (cs/tbl.supervisor.yml).
name: Supervisor
physical_name: cs_agent_d
datasource: cs_duckdb
description: 'Role of the agent table: the agent''s supervisor ON THE DAY of the contact (from agent history).'
cost: 55
fields:
- type: dimension
  name: Supervisor Email
  data_type: string
  expression:
    primary_key: true
    lookup: true
    sql: agent_user_id
- type: dimension
  name: Supervisor Sequence ID
  data_type: integer
  expression:
    lookup: true
    sql: agent_sequence_id
- type: dimension
  name: Supervisor Call Center ID
  data_type: string
  expression:
    lookup: true
    sql: call_center_id
  synonyms:
  - Call Center ID
- type: dimension
  name: Supervisor First Name
  data_type: string
  expression:
    lookup: true
    sql: first_name
- type: dimension
  name: Supervisor Last Name
  data_type: string
  expression:
    lookup: true
    sql: last_name
- type: dimension
  name: Supervisor Name
  data_type: string
  expression:
    lookup: true
    sql: first_name || ' ' || last_name
- type: dimension
  name: Supervisor Hire Date
  data_type: date
  grains:
  - day
  - week
  - month
  - quarter
  - year
  expression:
    lookup: true
    sql: hire_date
- type: dimension
  name: Supervisor Training Start Date
  data_type: date
  grains:
  - day
  - week
  - month
  - quarter
  - year
  expression:
    lookup: true
    sql: training_start_date
- type: dimension
  name: Supervisor Termination Date
  data_type: date
  grains:
  - day
  - week
  - month
  - quarter
  - year
  expression:
    lookup: true
    sql: termination_date
- type: dimension
  name: Supervisor Attrition Type
  data_type: string
  expression:
    lookup: true
    sql: attrition_type_desc
- type: dimension
  name: Supervisor Attrition Reason
  data_type: string
  expression:
    lookup: true
    sql: attrition_reason_desc
- type: dimension
  name: Supervisor Attrition Subreason
  data_type: string
  expression:
    lookup: true
    sql: attrition_subreason_desc
- type: dimension
  name: Supervisor Emp ID
  data_type: integer
  expression:
    lookup: true
    sql: agent_emp_id
- type: dimension
  name: Supervisor Trainer Email
  data_type: string
  expression:
    lookup: true
    sql: trainer_user_id
- type: dimension
  name: Supervisor Is Active
  data_type: integer
  expression:
    lookup: true
    sql: is_active
- type: dimension
  name: Manager Email
  data_type: string
  expression:
    lookup: true
    sql: current_supervisor_user_id
- type: dimension
  name: Supervisor Role Code
  data_type: string
  expression:
    lookup: true
    sql: current_agent_role_code
- type: dimension
  name: Supervisor Is Termination Controllable
  data_type: integer
  expression:
    lookup: true
    sql: is_termination_controllable
- type: dimension
  name: Supervisor Is Termination Regrettable
  data_type: integer
  expression:
    lookup: true
    sql: is_termination_regrettable
- type: dimension
  name: Supervisor Physical Location
  data_type: string
  expression:
    lookup: true
    sql: physical_location
