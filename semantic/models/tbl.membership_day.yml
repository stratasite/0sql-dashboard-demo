# Ported from the full cs-warehouse model (memberships/tbl.membership_day.yml).
name: Membership Day
physical_name: membership_day_d
datasource: cs_duckdb
description: 'Daily snapshot per subscription: membership state and signup / cancel events.'
cost: 100
# Points at this table's date dimension by name. Renaming that dimension
# without updating this line is silent until a snapshot measure is asked
# for, and then it is an Unresolvable path, not a wrong number.
snapshot: Membership Snapshot Date
fields:
- type: dimension
  name: Membership Snapshot Date
  data_type: date
  grains:
  - day
  - week
  - month
  - quarter
  - year
  expression:
    lookup: true
    sql: snapshot_date
  synonyms:
  - Date
- type: dimension
  name: Account ID
  data_type: integer
  expression:
    lookup: true
    sql: account_id
- type: dimension
  name: Subscription ID
  data_type: integer
  expression:
    lookup: true
    sql: subscrn_id
- type: dimension
  name: Membership Country Code
  data_type: string
  expression:
    lookup: true
    sql: country_iso_code
- type: dimension
  name: Paid Category
  description: Paid category on the snapshot_date
  data_type: string
  expression:
    lookup: true
    sql: paid_category
- type: dimension
  name: Membership Category
  data_type: string
  expression:
    lookup: true
