# Ported from the full cs-warehouse model (memberships/tbl.membership_day_agg.yml).
name: Membership Day Agg
physical_name: membership_day_agg
datasource: cs_duckdb
description: Daily membership snapshot pre-aggregated by country, plan and payment attributes.
cost: 50
# Points at this table's date dimension by name. Renaming that dimension
# without updating this line is silent until a snapshot measure is asked
# for, and then it is an Unresolvable path, not a wrong number.
snapshot: Membership Agg Date
fields:
- type: dimension
  name: Membership Agg Date
  data_type: date
  grains:
  - day
  - week
  - month
  - quarter
  - year
  expression:
    lookup: true
    sql: snapshot_date
  synonyms:
  - Date
- type: dimension
  name: Membership Agg Country Code
  data_type: string
  expression:
    lookup: true
    sql: country_iso_code
- type: dimension
  name: Paid Category
  data_type: string
  expression:
