# Contact fact — one row per customer service contact (call, chat, etc.).
# Grain: contact_code. ~5k rows spanning 2026-03-29 to 2026-09-27 in the sample warehouse.
datasource: cs_duckdb
name: Contact
physical_name: cs_contact_f
description: Customer service contacts at contact grain, with routing, handling durations, outcomes, tags, and cost.
cost: 100

fields:
  # ------------------------------------------------------------------ keys
  - type: dimension
    name: Contact Code
    data_type: string
    description: Unique contact identifier.
    expression:
      sql: contact_code
      lookup: true
      primary_key: true

  - type: dimension
    name: BPO Contact Code
    data_type: string
    description: Contact identifier in the BPO vendor's system.
    expression:
      sql: bpo_contact_code

  - type: dimension
    name: First Ticket ID
    data_type: string
    expression:
      sql: first_ticket_id

  # ------------------------------------------------------------------ dates / times
  - type: dimension
    name: Contact Date
    data_type: date
    description: UTC date of the contact.
    grains: [day, week, month, quarter, year]
    expression:
      sql: fact_utc_date
      lookup: true

  - type: dimension
    name: Contact Start Time
    data_type: date_time
    grains: [day, week, month, quarter, year]
    expression:
      sql: contact_start_ts

  - type: dimension
    name: Contact End Time
    data_type: date_time
    grains: [day, week, month, quarter, year]
    expression:
      sql: contact_end_ts

  - type: dimension
    name: UTC Half Hour
    data_type: string
    description: Half-hour bucket (HH:MM, UTC) in which the contact started.
    expression:
      sql: utc_half_hour_code
      lookup: true

  # ------------------------------------------------------------------ foreign keys
  - type: dimension
    name: Call Center ID
    data_type: string
    description: Call center that handled the contact.
    expression:
      sql: call_center_id
      lookup: true

  - type: dimension
    name: Escalating Call Center ID
    data_type: string
    description: Call center the contact was escalated to; null when not escalated.
    expression:
      sql: escalating_call_center_id
      lookup: true

  - type: dimension
    name: Contact Subchannel ID
    data_type: string
    synonyms: [subchannel, channel]
    expression:
      sql: contact_subchannel_id
      lookup: true

  - type: dimension
    name: Contact Skill ID
    data_type: string
    synonyms: [skill, skill id, queue]
    expression:
      sql: contact_skill_id
      lookup: true

  - type: dimension
    name: Transfer Type ID
    data_type: string
    description: Transfer code (NT, TI-ESC, TI-LANG, TO-WARM, TO-COLD).
    synonyms: [transfer code]
    expression:
      sql: transfer_type_id
      lookup: true

  - type: dimension
    name: Account ID
    data_type: bigint
    expression:
      sql: account_id

  - type: dimension
    name: Subscription ID
    data_type: bigint
    expression:
      sql: subscrn_id

  - type: dimension
    name: Current Subscription ID
    data_type: bigint
    expression:
      sql: current_subscription_id

  - type: dimension
    name: Current Plan ID
    data_type: bigint
    expression:
      sql: current_plan_id
      lookup: true

  - type: dimension
    name: Plan ID
    data_type: bigint
    expression:
      sql: plan_id
      lookup: true

  # ------------------------------------------------------------------ customer attributes
  - type: dimension
    name: Has DVD Plan
    data_type: integer
    description: 1 if the customer had a DVD plan at contact time, else 0.
    expression:
      sql: has_dvd_plan
      lookup: true

  - type: dimension
    name: Member Type
    data_type: string
    description: Customer membership status at contact time (e.g. Current Member, Former Member).
    expression:
      sql: member_type_desc
      lookup: true

  - type: dimension
    name: Customer Lookup Type
    data_type: string
    description: How the customer was identified (e.g. Authenticated).
    expression:
      sql: customer_lookup_type
      lookup: true

  - type: dimension
    name: Contact Origin Country Code
    data_type: string
    description: Country the contact originated from.
    expression:
      sql: contact_origin_country_code
      lookup: true

  - type: dimension
    name: Toll Free Number
    data_type: string
    expression:
      sql: toll_free_nbr
      lookup: true

  - type: dimension
    name: In-App Provider ID
    data_type: string
    description: App store provider for in-app contacts (e.g. appstore_a, appstore_g).
    expression:
      sql: inapp_provider_id
      lookup: true

  # ------------------------------------------------------------------ outcome / disposition
  - type: dimension
    name: Chat End State
    data_type: string
    description: How a chat ended (Agent Ended, Customer Ended, Abandoned, Timed Out).
    expression:
      sql: chat_end_state_desc
      lookup: true

  # The full model calls these "Driver Category / Level1 / Level2". Kept as
  # synonyms rather than renames: the names here are what the app's tiles and
  # the agent's prompt already use, and search_fields resolves either.
  - type: dimension
    name: Ticket Disposition Level 0
    data_type: string
    description: Top-level contact driver — why the customer got in touch.
    synonyms: [driver category, driver, contact driver, contact reason]
    expression:
      sql: ticket_disposition_level0_desc
      lookup: true

  - type: dimension
    name: Ticket Disposition Level 1
    data_type: string
    synonyms: [driver level1, sub driver]
    expression:
      sql: ticket_disposition_level1_desc
      lookup: true

  - type: dimension
    name: Ticket Disposition Level 2
    data_type: string
    synonyms: [driver level2]
    expression:
      sql: ticket_disposition_level2_desc
      lookup: true

  - type: dimension
    name: Ticket Resolution Gate
    data_type: string
    description: Resolution outcome (Resolved, Escalated, Follow-up Required, Referred Externally, Customer Education).
    synonyms: [resolution, next steps, resolution gate]
    expression:
      sql: ticket_resolution_gate_desc
      lookup: true

  - type: dimension
    name: Is Referred Externally
    data_type: integer
    expression:
      sql: is_referred_externally
      lookup: true

  - type: dimension
    name: Is Assistance Requested
    data_type: integer
    expression:
      sql: is_assistance_requested
      lookup: true

  - type: dimension
    name: Is Secondary Skill Contact
    data_type: integer
    expression:
      sql: is_secondary_skill_contact
      lookup: true

  - type: dimension
    name: Deferred Cancel Reasons
    data_type: string
    expression:
      sql: deferred_cancel_reasons
      lookup: true

  - type: dimension
    name: Deferred Cancel Reason Other
    data_type: string
    expression:
      sql: deferred_cancel_reason_other

  - type: dimension
    name: Immediate Cancel Reasons
    data_type: string
    expression:
      sql: immediate_cancel_reasons
      lookup: true

  - type: dimension
    name: Immediate Cancel Reason Other
    data_type: string
    expression:
      sql: immediate_cancel_reason_other

  # ------------------------------------------------------------------ agent
  - type: dimension
    name: Agent Role Code
    data_type: string
    description: Role of the handling agent (e.g. CSR1, CSR2).
    expression:
      sql: agent_role_code
      lookup: true

  - type: dimension
    name: Agent User ID
    data_type: string
    synonyms: [agent email, agent]
    expression:
      sql: agent_user_id
      lookup: true

  - type: dimension
    name: Supervisor User ID
    data_type: string
    synonyms: [supervisor email, supervisor]
    expression:
      sql: supervisor_user_id
      lookup: true

  - type: dimension
    name: Manager User ID
    data_type: string
    synonyms: [manager email, manager]
    expression:
      sql: manager_user_id
      lookup: true

  - type: dimension
    name: Workplace
    data_type: string
    description: Where the agent worked the contact (e.g. Onsite, Remote).
    expression:
      sql: workplace
      lookup: true

  # ------------------------------------------------------------------ tags
  - type: dimension
    name: Tag Primary Title
    data_type: string
    expression:
      sql: tag_primary_title
      lookup: true

  - type: dimension
    name: Tag Titles
    data_type: string
    expression:
      sql: tag_titles

  - type: dimension
    name: Tag Primary Hashtag
    data_type: string
    expression:
      sql: tag_primary_hashtag
      lookup: true

  - type: dimension
    name: Tag Hashtags
    data_type: string
    expression:
      sql: tag_hashtags

  - type: dimension
    name: Tag Primary MOP
    data_type: string
    description: Primary method-of-payment tag.
    expression:
      sql: tag_primary_mop
      lookup: true

  - type: dimension
    name: Tag MOPs
    data_type: string
    expression:
      sql: tag_mops

  - type: dimension
    name: Tag Primary Error
    data_type: string
    expression:
      sql: tag_primary_error
      lookup: true

  - type: dimension
    name: Tag Errors
    data_type: string
    expression:
      sql: tag_errors

  - type: dimension
    name: Tag Primary Device Model ID
    data_type: string
    expression:
      sql: tag_primary_device_model_id
      lookup: true

  - type: dimension
    name: Tag Device Model IDs
    data_type: string
    expression:
      sql: tag_device_model_ids

  - type: dimension
    name: Tag Primary Device Type ID
    data_type: string
    expression:
      sql: tag_primary_device_type_id
      lookup: true

  - type: dimension
    name: Tag Device Type IDs
    data_type: string
    expression:
      sql: tag_device_type_ids

  # ------------------------------------------------------------------ ATO (account takeover) model
  - type: dimension
    name: ATO Label
    data_type: string
    description: Account-takeover classification of the contact (ATO / NOT_ATO).
    expression:
      sql: ato_label
      lookup: true

  - type: dimension
    name: ATO Model Version
    data_type: string
    expression:
      sql: ato_model_version
      lookup: true

  # ================================================================== measures
  # --- volume
  - type: measure
    name: Contacts
    data_type: bigint
    description: Number of contacts.
    expression:
      sql: count(*)

  - type: measure
    name: Answered Count
    data_type: bigint
    expression:
      sql: sum(answered_cnt)

  - type: measure
    name: Answered In SLA Count
    data_type: bigint
    expression:
      sql: sum(answered_in_sla_cnt)

  - type: measure
    name: Abandoned In SLA Count
    data_type: bigint
    expression:
      sql: sum(abandoned_in_sla_cnt)

  - type: measure
    name: Gateway Count
    data_type: bigint
    expression:
      sql: sum(gateway_cnt)

  - type: measure
    name: Gateway Abandoned Count
    data_type: bigint
    expression:
      sql: sum(gateway_abandoned_cnt)

  - type: measure
    name: Offered To BPO Count
    data_type: bigint
    expression:
      sql: sum(offerred_to_bpo_cnt)

  - type: measure
    name: BPO Switch Count
    data_type: bigint
    expression:
      sql: sum(bpo_switch_cnt)

  - type: measure
    name: BPO Switch Abandoned Count
    data_type: bigint
    expression:
      sql: sum(bpo_switch_abandoned_cnt)

  - type: measure
    name: BPO Skill Count
    data_type: bigint
    expression:
      sql: sum(bpo_skill_cnt)

  - type: measure
    name: BPO Skill Abandoned Count
    data_type: bigint
    expression:
      sql: sum(bpo_skill_abandoned_cnt)

  - type: measure
    name: Customer Message Count
    data_type: bigint
    expression:
      sql: sum(cust_msg_cnt)

  - type: measure
    name: Agent Response Count
    data_type: bigint
    expression:
      sql: sum(agent_response_cnt)

  # --- durations (seconds)
  - type: measure
    name: Contact Duration Secs
    data_type: bigint
    description: Total end-to-end contact duration in seconds.
    expression:
      sql: sum(contact_duration_secs)

  - type: measure
    name: Gateway Duration Secs
    data_type: bigint
    expression:
      sql: sum(gateway_duration_secs)

  - type: measure
    name: BPO Duration Secs
    data_type: bigint
    expression:
      sql: sum(bpo_duration_secs)

  - type: measure
    name: Customer Queue Duration Secs
    data_type: bigint
    expression:
      sql: sum(customer_queue_duration_secs)

  - type: measure
    name: Customer Hold Duration Secs
    data_type: bigint
    expression:
      sql: sum(customer_hold_duration_secs)

  - type: measure
    name: Talk Duration Secs
    data_type: bigint
    expression:
      sql: sum(talk_duration_secs)

  - type: measure
    name: ACW Duration Secs
    data_type: bigint
    description: After-call work time in seconds.
    expression:
      sql: sum(acw_duration_secs)

  - type: measure
    name: Consult Duration Secs
    data_type: bigint
    expression:
      sql: sum(consult_duration_secs)

  - type: measure
    name: Answer Hold Duration Secs
    data_type: bigint
    expression:
      sql: sum(answer_hold_duration_secs)

  - type: measure
    name: Agent Response Secs
    data_type: bigint
    expression:
      sql: sum(agent_response_sec)

  - type: measure
    name: Average Contact Duration Secs
    data_type: decimal
    description: Mean contact duration per contact.
    expression:
      sql: sum(contact_duration_secs) * 1.0 / nullif(count(*), 0)

  # --- tickets / makegoods
  - type: measure
    name: Ticket Count
    data_type: bigint
    expression:
      sql: sum(ticket_cnt)

  - type: measure
    name: Makegood Amount
    data_type: decimal
    description: Total credits or refunds issued as makegoods.
    expression:
      sql: sum(makegood_amt)

  - type: measure
    name: Makegood Ticket Count
    data_type: bigint
    expression:
      sql: sum(makegood_ticket_cnt)

  # --- knowledge base
  - type: measure
    name: KB Articles Used Count
    data_type: bigint
    expression:
      sql: sum(kb_articles_used_cnt)

  - type: measure
    name: KB Search Count
    data_type: bigint
    expression:
      sql: sum(kb_search_cnt)

  # --- cost (USD)
  # Tagged `cost-sensitive`: the Regional Cost Visibility policy in
  # security.yml filters these to the caller's regions at plan time.
  - type: measure
    name: CSR1 Cost USD
    tags: [cost-sensitive]
    data_type: decimal
    expression:
      sql: sum(csr1_cost_usd)

  - type: measure
    name: CSR2 Cost USD
    tags: [cost-sensitive]
    data_type: decimal
    expression:
      sql: sum(csr2_cost_usd)

  - type: measure
    name: Non-BPO Cost USD
    tags: [cost-sensitive]
    data_type: decimal
    expression:
      sql: sum(non_bpo_cost_usd)

  - type: measure
    name: Telecom Cost USD
    tags: [cost-sensitive]
    data_type: decimal
    expression:
      sql: sum(telecom_cost_usd)

  - type: measure
    name: Total Contact Cost USD
    tags: [cost-sensitive]
    data_type: decimal
    description: CSR1 + CSR2 + non-BPO + telecom cost.
    expression:
      sql: sum(coalesce(csr1_cost_usd, 0) + coalesce(csr2_cost_usd, 0) + coalesce(non_bpo_cost_usd, 0) + coalesce(telecom_cost_usd, 0))

  # ================================================================ derived
  # The measures above are raw sums: additive, and safe to slice by anything.
  # The ones below are the numbers the business actually runs on, and they are
  # ratios — which is exactly why they belong here rather than in whatever
  # formula a caller writes. A ratio of two sums is not the sum of two ratios,
  # so "average handle time by region" computed per row and averaged is wrong,
  # and it is wrong in a way nobody notices. Published once, it is computed
  # once, the same way, for the dashboard, the agent and any other client.

  # --- throughput and service level
  - type: measure
    name: Handled Minutes
    data_type: decimal
    description: >-
      Productive agent minutes — answer hold, talk and after-call work — on
      contacts this site actually handled. Transfer-outs are excluded: that
      time belongs to whoever the contact went to.
    synonyms: [productive minutes, handle minutes, agent minutes]
    expression:
      sql: >-
        sum(case when [Major Transfer Type] <> 'TRANSFER_OUT'
                 then answer_hold_duration_secs + talk_duration_secs + acw_duration_secs
                 else 0 end) / 60.0

  - type: measure
    name: AHT Mins
    data_type: decimal
    format: number:2
    description: >-
      Average handle time per answered contact, in minutes: answer hold plus
      talk plus after-call work. This is handle time in the industry sense, and
      it is not Average Contact Duration Secs, which is wall-clock from arrival
      to end and includes queue time nobody was working.
    synonyms: [AHT, average handle time, handle time]
    expression:
      sql: >-
        sum(answer_hold_duration_secs + talk_duration_secs + acw_duration_secs)
          / nullif(sum(answered_cnt), 0) / 60.0

  - type: measure
    name: ASA Secs
    data_type: decimal
    format: number:1
    description: >-
      Average speed of answer, in seconds: gateway time plus the queue wait of
      contacts that were answered, over answered contacts.
    synonyms: [ASA, average speed of answer, speed of answer, wait time]
    expression:
      sql: >-
        sum((case when answered_cnt > 0 then customer_queue_duration_secs else 0 end)
            + gateway_duration_secs) * 1.0 / nullif(sum(answered_cnt), 0)

  - type: measure
    name: ART Secs
    data_type: decimal
    format: number:1
    description: Average agent response time on a chat contact, in seconds.
    synonyms: [ART, agent response time, response time]
    expression:
      sql: sum(agent_response_sec) * 1.0 / nullif(sum(agent_response_cnt), 0)

  - type: measure
    name: SLA Rate
    data_type: decimal
    format: percent:1
    description: Share of answered contacts that were answered inside the SLA.
    synonyms: [service level, in SLA, '% in SLA']
    expression:
      sql: sum(answered_in_sla_cnt) * 1.0 / nullif(sum(answered_cnt), 0)

  - type: measure
    name: Abandon Rate
    data_type: decimal
    format: percent:1
    description: Share of contacts offered to a skill that the customer abandoned.
    synonyms: ['% abandoned skill', abandonment rate, abandon]
    expression:
      sql: sum(bpo_skill_abandoned_cnt) * 1.0 / nullif(sum(bpo_skill_cnt), 0)

  - type: measure
    name: Gateway Abandon Rate
    data_type: decimal
    format: percent:1
    description: Share of gateway contacts abandoned before reaching a skill.
    synonyms: [gateway abandonment, IVR abandon rate]
    expression:
      sql: sum(gateway_abandoned_cnt) * 1.0 / nullif(sum(gateway_cnt), 0)

  # --- outcomes
  - type: measure
    name: Escalation Rate
    data_type: decimal
    format: percent:1
    description: >-
      Share of handled contacts where the agent asked for assistance.
      Transfer-outs are out of the denominator — they were handed off, not
      escalated.
    synonyms: ['% esc rate', escalation, escalations]
    expression:
      sql: >-
        sum(is_assistance_requested) * 1.0
          / nullif(sum(case when [Major Transfer Type] <> 'TRANSFER_OUT'
                            then answered_cnt else 0 end), 0)

  - type: measure
    name: Makegood Rate
    data_type: decimal
    format: percent:1
    description: Share of tickets that resulted in a credit or refund.
    synonyms: ['% MG rate', makegood ticket rate]
    expression:
      sql: sum(makegood_ticket_cnt) * 1.0 / nullif(sum(ticket_cnt), 0)

  - type: measure
    name: Makegood Amount Per Ticket
    data_type: decimal
    format: currency:2
    description: >-
      Makegood dollars per ticket handled here. The full model calls this
      "$ MG per Contact"; the denominator is tickets, not contacts, so it is
      named for what it divides by.
    synonyms: ['$ MG per contact', makegood per ticket]
    expression:
      sql: >-
        sum(makegood_amt) * 1.0
          / nullif(sum(case when [Major Transfer Type] <> 'TRANSFER_OUT'
                            then ticket_cnt else 0 end), 0)

  - type: measure
    name: Authenticated Rate
    data_type: decimal
    format: percent:1
    description: >-
      Share of answered contacts where the customer was identified. account_id
      is -1 when they were not, which is a value, not a null.
    synonyms: ['% authenticated', authentication rate, identified]
    expression:
      sql: >-
        sum(case when account_id is not null and account_id <> -1
                 then answered_cnt else 0 end) * 1.0
          / nullif(sum(answered_cnt), 0)

  # --- distinct counts. Not additive: the agents working Manila and the agents
  # working Cebu do not add up to the agents working both, and asking for this
  # by month will not sum to the year.
  - type: measure
    name: Agents
    data_type: bigint
    description: Distinct agents who handled a contact in the slice.
    synonyms: ['# agents', headcount, distinct agents]
    expression:
      sql: count(distinct agent_user_id)

  - type: measure
    name: Accounts Contacting
    data_type: bigint
    description: >-
      Distinct customer accounts that made contact. Unidentified callers carry
      account_id -1 and are excluded, so this counts customers rather than
      counting "unknown" as one of them.
    synonyms: ['# accounts contacting', unique customers, distinct accounts]
    expression:
      sql: count(distinct case when account_id <> -1 then account_id end)

  # --- unit cost (USD)
  # Every one of these is tagged `cost-sensitive`, for the same reason the raw
  # cost sums are: a rate derived from cost is still cost. Leave the tag off and
  # the Regional Cost Visibility policy stops firing, and a caller who may not
  # read EMEA cost can read EMEA cost per contact instead.
  - type: measure
    name: CSR1 Cost Per Contact USD
    tags: [cost-sensitive]
    data_type: decimal
    format: currency:2
    synonyms: [CSR1 CPC]
    expression:
      sql: sum(csr1_cost_usd) * 1.0 / nullif(sum(answered_cnt), 0)

  - type: measure
    name: CSR2 Cost Per Contact USD
    tags: [cost-sensitive]
    data_type: decimal
    format: currency:2
    synonyms: [CSR2 CPC]
    expression:
      sql: sum(csr2_cost_usd) * 1.0 / nullif(sum(answered_cnt), 0)

  - type: measure
    name: Telecom Cost Per Contact USD
    tags: [cost-sensitive]
    data_type: decimal
    format: currency:2
    synonyms: [telecom CPC]
    expression:
      sql: sum(telecom_cost_usd) * 1.0 / nullif(sum(answered_cnt), 0)

  - type: measure
    name: Non-BPO Cost Per Contact USD
    tags: [cost-sensitive]
    data_type: decimal
    format: currency:2
    synonyms: [non BPO CPC]
    expression:
      sql: sum(non_bpo_cost_usd) * 1.0 / nullif(sum(answered_cnt), 0)

  # A compound over the totals, not the sum of the four rates above: a component
  # with no rows contributes a null, and null + 4.59 is null. The full model
  # adds the rates and inherits that hole.
  - type: measure
    name: Cost Per Contact USD
    tags: [cost-sensitive]
    data_type: decimal
    format: currency:2
    description: Total customer service cost per answered contact (CPC).
    synonyms: [CPC, CS CPC, cost per contact, unit cost]
    expression:
      sql: ([Total Contact Cost USD]) * 1.0 / nullif([Answered Count], 0)

  - type: measure
    name: Cost Per Minute USD
    tags: [cost-sensitive]
    data_type: decimal
    format: currency:2
    description: Total customer service cost per productive agent minute (CPM).
    synonyms: [CPM, CS CPM, cost per minute]
    expression:
      sql: ([Total Contact Cost USD]) * 1.0 / nullif([Handled Minutes], 0)

  # --- measures that reach past the contact fact
  # These were impossible until the membership and recontact tables were in the
  # model. They are compounds across facts: the host table (this one) sets the
  # dimensionality, and the planner works out the join.
  - type: measure
    name: Contact Rate
    data_type: decimal
    format: percent:3
    description: >-
      Answered contacts as a share of the membership base. Volume alone says how
      busy the floor was; this says how much of the customer base felt the need
      to get in touch, which is the number that survives the base growing.
    synonyms: [contact rate, contacts per member, contact incidence]
    expression:
      sql: ([Answered Count]) / ([Memberships] * 1.000)

  - type: measure
    name: Agent Reconnect Contacts
    data_type: bigint
    description: Answered contacts where the agent reconnected with the customer.
    synonyms: ['# agent reconn. volume', agent reconnect]
    expression:
      sql: sum(case when [Is Agent Reconnect] = 1 then answered_cnt else 0 end)
