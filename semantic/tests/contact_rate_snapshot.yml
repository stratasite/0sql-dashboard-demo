# The most load-bearing query path in the model, and the least visible from the
# spec. "Contact Rate by region" names two fields and no tables, yet planning it
# correctly means: route to the membership rollup rather than the 453k-row
# detail; resolve Memberships as an ENDING snapshot, which is a MAX(snapshot_date)
# CTE and an inner join back to it, not a sum over every day; and combine the two
# facts with a cross join, because memberships carry no call center.
#
# Summing the daily rows instead would inflate the denominator by a factor of
# the number of days and quietly return a near-zero rate. This broke once
# already: renaming the table's date dimension left the table-level `snapshot:`
# key pointing at a name that no longer existed, and nothing surfaced it until
# the measure was asked for.
name: contact rate reads memberships as an ending snapshot
projections:
  - Call Center Region
  - Contact Rate
assert_regex: (?s)MAX\(\w+\."snapshot_date"\).*sum\(\w+\."membership_cnt"\).*INNER JOIN.*\."snapshot_date" = .*CROSS JOIN
